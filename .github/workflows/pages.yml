# Publish marathon-miles.com to GitHub Pages.
#
# The site is assembled rather than committed: site/ holds the landing page,
# the CNAME and the social card, and the GAME is the repo's own index.html
# copied in at deploy time. That copy is deliberate -- index.html is a 2.8 MB
# build artifact and committing a second copy of it under site/game/ would
# double it in every commit that touches the build.
#
# The landing page is at /, the game at /game/, which is what the PLAY links
# point at.
name: Deploy site

# main ONLY, and the reason is on the record rather than assumed. The first
# draft also listed the working branch, and the two raced: run 3 (main) was
# CANCELLED three seconds in by run 4 (the branch), because they share the
# concurrency group below. Feature work must never be able to cancel -- or
# publish over -- a production deploy. Development happens on branches; the
# live site is whatever is on main.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'index.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # index.html is committed, so there is nothing to build here. It is
      # verified instead: build --check fails if the committed artifact is not
      # what the source produces, which is the one thing that could silently
      # ship a stale game.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: The committed game must match its source
        run: node tools/build.js --check

      - name: Assemble the site
        run: |
          mkdir -p _site/game
          cp -r site/. _site/
          cp index.html _site/game/index.html

      # enablement: true asks the API to turn Pages on and set its build type to
      # this workflow, so the repository does not have to be configured by hand
      # first. It needs admin rights on the repo; when the token does not have
      # them this step still fails with "Get Pages site failed", which is the
      # signal to switch Pages on manually under Settings > Pages > Build and
      # deployment > Source: GitHub Actions. Everything before this point --
      # including the build --check that guards against shipping a stale game --
      # has already run and passed by then.
      - uses: actions/configure-pages@v4
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
