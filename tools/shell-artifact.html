<!-- ==================== WHAT THIS SHELL CAN AND CANNOT CARRY ============

     tools/shell.html grew a full head this pass -- description, Open Graph,
     Twitter card, favicon, apple-touch-icon and a web app manifest. Almost
     none of it belongs here, and the reason is structural rather than a
     matter of taste, so it is written down instead of being rediscovered.

     THIS FILE HAS NO DOCUMENT SKELETON. The artifact host supplies the
     doctype, the head and the body and drops this content INSIDE the body.
     Checked on the real build rather than assumed: loaded standalone the
     parser hoists the title above into <head> (head children: TITLE, STYLE),
     which is why the title works in both places -- but under the host it is
     body content, and body content is not the document head.

     SO: og: and twitter: tags added here would be inert. A link unfurler
     reads the head of the URL it was given, which is the HOST's head, not
     this fragment; nothing written in this file can reach it. Adding them
     would be markup that looks like it is doing something and is not, which
     is worse than their absence.

     WHAT DOES SURVIVE is the pair below. A title element is read by
     document.title wherever it appears, and the host also scans this file's
     first 8KB for it. A link rel=icon is in-body metadata that browsers do
     honour, and it is harmless where the host sets its own tab icon -- the
     host simply wins. Both are the same data: URI the full shell uses, so
     there is one mark and not two.
     ================================================================== -->

<style>
/* The artifact host supplies the document skeleton and its own reset, so this
 * variant ships no doctype/html/head/body of its own. It also renders inside a
 * frame that may not be the full viewport, so the canvas sizes to 100% of its
 * container rather than to the window.
 *
 * dvh, NOT vh, and the difference is the whole bug.
 *
 * On a phone, 100vh is the LARGE viewport -- the height the page would have if
 * the browser's retractable toolbars were hidden. They are not hidden, so the
 * bottom of a 100vh element sits underneath them. Reported from an iPhone:
 * the runner's feet cut off at the bottom of the frame and the progress bar's
 * lower half behind the Safari toolbar, with the game itself framing him
 * correctly -- measured, the feet clear the rail by 77-109px in every portrait
 * size the harness photographs.
 *
 * 100dvh is the DYNAMIC viewport: what is actually visible right now, tracking
 * the toolbars as they show and hide. The plain vh line stays as a fallback
 * for anything that does not know dvh (Safari before 15.4), where the old
 * behaviour is still better than a collapsed frame.
 *
 * This cannot be caught by the screenshot harness. Headless Chromium has no
 * retractable chrome, so vh and dvh are identical there and every shot passes.
 * It is a real-device defect and it took a photograph from one to find it. */
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0e1230; }
#mr-root {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  min-height: 520px;
  overflow: hidden;
  background: #0e1230;
}
/*__CSS__*/
/* Re-scope the two fixed-position layers into the frame. */
#mr-root #gl { position: absolute; inset: 0; width: 100%; height: 100%; }
#mr-root #ui { position: absolute; inset: 0; }
</style>
<div id="mr-root">
  <canvas id="gl"></canvas>
  <div id="ui"></div>
</div>
