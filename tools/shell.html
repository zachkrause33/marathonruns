<!-- ==================== WHAT THE LINK LOOKS LIKE ====================

     Everything from here to the closing rule exists for the moment the game
     stops being a private URL. The page had a charset, a viewport, a
     theme-color and a title, and nothing else -- so a pasted link rendered as
     a bare URL in every messenger, the tab carried the browser's default
     document glyph, and Add to Home Screen produced an unnamed icon
     containing a screenshot of a dark canvas.

     A share string is wasted on a link that renders as nothing, and the share
     string is now the point of the finish card, so the two ship together.

     SELF-CONTAINED, WITH ONE STATED EXCEPTION. The favicon, the home-screen
     icon and the web app manifest are all data: URIs, because the premise of
     this project is one file that runs from file:// with nothing fetched. The
     Open Graph image CANNOT be: the scraper behind Slack, iMessage, WhatsApp
     and Twitter is not a browser, it fetches og:image over HTTP from its own
     servers, and every one of them rejects a data: URI.

     THAT IS NOW SETTLED: the card is committed at site/marathon-miles-og.png
     and .github/workflows/pages.yml publishes site/ to marathon-miles.com, so
     the image is served from the same origin as the page that references it.
     THE GAME IS THE ROOT, so og:url is the bare domain. It was briefly at
     /game/ with a landing page in front; the owner moved it, on the reasoning
     a daily game lives or dies by: the URL should BE the game, so a returning
     player is one tap from running. The explainer moved to /how-to-play/, the
     start panel links out to it, and /game/ is kept as a redirect because
     that URL was already shared.

     Regenerate the card with node tools/ogimage.js (deterministic) and copy it
     over site/marathon-miles-og.png if the wordmark or the target ever change.

     It was a placeholder until the domain existed, and deliberately an
     unresolvable name rather than an invented domain: a scraper that cannot
     fetch it falls back to the title and the description, which is a correct
     preview minus a picture. A made-up domain would eventually belong to
     somebody else, and the game
     would be advertising their image under its own name.
     ================================================================== -->

<meta name="description" content="One marathon a day. Everyone on the planet races the same date-seeded road: three lanes, 26.2 miles, and a world record of 1:59:30 to break.">

<!-- Add to Home Screen. Two mechanisms, because the two platforms have never
     agreed on one: iOS reads apple-touch-icon and the apple-mobile-web-app-*
     pair, Android and desktop Chrome read the manifest. Both are inlined.
     The icon is a real PNG rather than the SVG above because iOS does not
     accept an SVG here, and it is drawn edge to edge because iOS masks the
     corners itself and renders a transparent PNG as a black square.

     THE MANIFEST IS A data: URI AND IT WAS CHECKED RATHER THAN ASSUMED.
     Chrome fetches and parses it -- read back through the DevTools protocol
     (Page.getAppManifest) on the real built page. It carries NO start_url and
     NO scope, and that is the finding rather than an omission: relative URLs
     in a manifest resolve against the MANIFEST's own URL, and the base of a
     data: URI is not a directory, so both properties came back as "URL is
     invalid" and were dropped. Left out, Chrome falls back to the document's
     own URL for scope and start_url, which is what a single-file game wants
     anyway, and the manifest parses with zero errors. If this game ever gets
     a real hosted URL those two lines can come back with absolute values. -->
